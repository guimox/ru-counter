name: Deploy Lambda

on:
  push:
    branches: [deploy]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION  }}
  FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Lambda package
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags='-s -w' -o bootstrap .
          zip -j function.zip bootstrap

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create or update Lambda
        env:
          LAMBDA_ROLE_ARN: ${{ secrets.AWS_LAMBDA_ROLE_ARN }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          NUMBER_NEWSLETTERS: ${{ vars.NUMBER_NEWSLETTERS }}
          NEWSLETTER_JID1: ${{ secrets.NEWSLETTER_JID1 }}
          NEWSLETTER_NAME1: ${{ vars.NEWSLETTER_NAME1 }}
          NEWSLETTER_JID2: ${{ secrets.NEWSLETTER_JID2 }}
          NEWSLETTER_NAME2: ${{ vars.NEWSLETTER_NAME2 }}
          NEWSLETTER_JID3: ${{ secrets.NEWSLETTER_JID3 }}
          NEWSLETTER_NAME3: ${{ vars.NEWSLETTER_NAME3 }}
          NEWSLETTER_JID4: ${{ secrets.NEWSLETTER_JID4 }}
          NEWSLETTER_NAME4: ${{ vars.NEWSLETTER_NAME4 }}
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
          DB_FILE_NAME: ${{ vars.DB_FILE_NAME || 'session.db' }}
        run: |
          set -euo pipefail

          environment=$(jq -n \
            --arg pat "$PAT_TOKEN" \
            --arg count "$NUMBER_NEWSLETTERS" \
            --arg jid1 "$NEWSLETTER_JID1" --arg name1 "$NEWSLETTER_NAME1" \
            --arg jid2 "$NEWSLETTER_JID2" --arg name2 "$NEWSLETTER_NAME2" \
            --arg jid3 "$NEWSLETTER_JID3" --arg name3 "$NEWSLETTER_NAME3" \
            --arg jid4 "$NEWSLETTER_JID4" --arg name4 "$NEWSLETTER_NAME4" \
            --arg bucket "$S3_BUCKET_NAME" --arg db "$DB_FILE_NAME" \
            '{Variables:{PAT_TOKEN:$pat,NUMBER_NEWSLETTERS:$count,NEWSLETTER_JID1:$jid1,NEWSLETTER_NAME1:$name1,NEWSLETTER_JID2:$jid2,NEWSLETTER_NAME2:$name2,NEWSLETTER_JID3:$jid3,NEWSLETTER_NAME3:$name3,NEWSLETTER_JID4:$jid4,NEWSLETTER_NAME4:$name4,S3_BUCKET_NAME:$bucket,DB_FILE_NAME:$db}}')

          if aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --architectures arm64 \
              --zip-file fileb://function.zip
            aws lambda wait function-updated --function-name "$FUNCTION_NAME"
            aws lambda update-function-configuration \
              --function-name "$FUNCTION_NAME" \
              --runtime provided.al2023 \
              --handler bootstrap \
              --architectures arm64 \
              --timeout 300 \
              --memory-size 1024 \
              --environment "$environment"
          else
            aws lambda create-function \
              --function-name "$FUNCTION_NAME" \
              --runtime provided.al2023 \
              --handler bootstrap \
              --architectures arm64 \
              --role "$LAMBDA_ROLE_ARN" \
              --timeout 300 \
              --memory-size 1024 \
              --environment "$environment" \
              --zip-file fileb://function.zip
          fi
