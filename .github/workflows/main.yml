name: Build and Deploy Go API

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    name: Build and Deploy Go API
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_TOKEN }}

      - name: Push Docker Image to GitHub Container Registry
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}/${{ secrets.DOCKER_CONTAINER_NAME }}:latest
            ghcr.io/${{ github.repository }}/${{ secrets.DOCKER_CONTAINER_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create app directory on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_IP_ADDRESS }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            if [ ! -d "/home/${{ secrets.VPS_USERNAME }}/apps/ru-counter" ]; then
              mkdir -p /home/${{ secrets.VPS_USERNAME }}/apps/ru-counter
            fi

      - name: Upload docker-compose-prd.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_IP_ADDRESS }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "docker-compose-prd.yml"
          target: "/home/${{ secrets.VPS_USERNAME }}/apps/ru-counter/"

      - name: Create .env file on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_IP_ADDRESS }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /home/${{ secrets.VPS_USERNAME }}/apps/ru-counter
            cat > .env << EOF
            APP_PORT=${{ secrets.APP_PORT }}
            DOCKER_CONTAINER_NAME=${{ secrets.DOCKER_CONTAINER_NAME }}
            PAT_TOKEN=${{ secrets.PAT_TOKEN }}
            GITHUB_REPOSITORY=${{ github.repository }}
            NUMBER_NEWSLETTERS=${{ secrets.NUMBER_NEWSLETTERS }}
            NEWSLETTER_JID1=${{ secrets.NEWSLETTER_JID1 }}
            NEWSLETTER_NAME1=${{ secrets.NEWSLETTER_NAME1 }}
            NEWSLETTER_JID2=${{ secrets.NEWSLETTER_JID2 }}
            NEWSLETTER_NAME2=${{ secrets.NEWSLETTER_NAME2 }}
            NEWSLETTER_JID3=${{ secrets.NEWSLETTER_JID3 }}
            NEWSLETTER_NAME3=${{ secrets.NEWSLETTER_NAME3 }}
            NEWSLETTER_JID4=${{ secrets.NEWSLETTER_JID4 }}
            NEWSLETTER_NAME4=${{ secrets.NEWSLETTER_NAME4 }}
            EOF
            chmod 600 .env

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_IP_ADDRESS }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo "${{ secrets.PAT_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            cd /home/${{ secrets.VPS_USERNAME }}/apps/ru-counter

            docker pull ghcr.io/${{ github.repository }}/${{ secrets.DOCKER_CONTAINER_NAME }}:latest

            docker compose -f docker-compose-prd.yml down --remove-orphans
            docker compose -f docker-compose-prd.yml up -d --force-recreate --remove-orphans
            docker image prune -f

  deploy-lambda:
    name: Deploy Go Lambda
    runs-on: ubuntu-24.04
    needs: build-deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build Lambda binary
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bootstrap .
          zip -j lambda.zip bootstrap

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create or update Lambda function
        env:
          FUNCTION_NAME: go-ru-counter
          LAMBDA_ROLE_ARN: ${{ secrets.AWS_LAMBDA_ROLE_ARN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          NUMBER_NEWSLETTERS: ${{ secrets.NUMBER_NEWSLETTERS }}
          NEWSLETTER_JID1: ${{ secrets.NEWSLETTER_JID1 }}
          NEWSLETTER_NAME1: ${{ secrets.NEWSLETTER_NAME1 }}
          NEWSLETTER_JID2: ${{ secrets.NEWSLETTER_JID2 }}
          NEWSLETTER_NAME2: ${{ secrets.NEWSLETTER_NAME2 }}
          NEWSLETTER_JID3: ${{ secrets.NEWSLETTER_JID3 }}
          NEWSLETTER_NAME3: ${{ secrets.NEWSLETTER_NAME3 }}
          NEWSLETTER_JID4: ${{ secrets.NEWSLETTER_JID4 }}
          NEWSLETTER_NAME4: ${{ secrets.NEWSLETTER_NAME4 }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          DB_FILE_NAME: ${{ secrets.DB_FILE_NAME }}
        run: |
          set -e

          ENV_JSON=$(jq -n \
            --arg pat "$PAT_TOKEN" \
            --arg num "$NUMBER_NEWSLETTERS" \
            --arg jid1 "$NEWSLETTER_JID1" \
            --arg name1 "$NEWSLETTER_NAME1" \
            --arg jid2 "$NEWSLETTER_JID2" \
            --arg name2 "$NEWSLETTER_NAME2" \
            --arg jid3 "$NEWSLETTER_JID3" \
            --arg name3 "$NEWSLETTER_NAME3" \
            --arg jid4 "$NEWSLETTER_JID4" \
            --arg name4 "$NEWSLETTER_NAME4" \
            --arg bucket "$S3_BUCKET_NAME" \
            --arg db "$DB_FILE_NAME" \
            --arg region "$AWS_REGION" \
            '{
              PAT_TOKEN: $pat,
              NUMBER_NEWSLETTERS: $num,
              NEWSLETTER_JID1: $jid1,
              NEWSLETTER_NAME1: $name1,
              NEWSLETTER_JID2: $jid2,
              NEWSLETTER_NAME2: $name2,
              NEWSLETTER_JID3: $jid3,
              NEWSLETTER_NAME3: $name3,
              NEWSLETTER_JID4: $jid4,
              NEWSLETTER_NAME4: $name4,
              S3_BUCKET_NAME: $bucket,
              DB_FILE_NAME: $db,
              AWS_REGION: $region
            }')

          if aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --zip-file fileb://lambda.zip >/dev/null

            aws lambda update-function-configuration \
              --function-name "$FUNCTION_NAME" \
              --runtime provided.al2023 \
              --handler bootstrap \
              --timeout 900 \
              --memory-size 512 \
              --environment "Variables=${ENV_JSON}" >/dev/null
          else
            aws lambda create-function \
              --function-name "$FUNCTION_NAME" \
              --runtime provided.al2023 \
              --role "$LAMBDA_ROLE_ARN" \
              --handler bootstrap \
              --zip-file fileb://lambda.zip \
              --timeout 900 \
              --memory-size 512 \
              --architectures x86_64 \
              --environment "Variables=${ENV_JSON}" >/dev/null
          fi

          aws lambda publish-version --function-name "$FUNCTION_NAME" >/dev/null
